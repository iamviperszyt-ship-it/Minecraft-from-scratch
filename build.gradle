plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'org.jmonkeyengine:jme3-core:3.10.0-SNAPSHOT'
    implementation 'org.jmonkeyengine:jme3-desktop:3.10.0-SNAPSHOT'
    implementation 'org.jmonkeyengine:jme3-lwjgl3:3.10.0-SNAPSHOT'
}

mainClassName = 'voxelgame.Main'